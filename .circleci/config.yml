version: 2.1

commands:
  sync-submodules:
    steps:
      - run: git submodule sync
      - run: git submodule update --init
  checkout-submodules:
    steps:
      - checkout:
          method: blobless
      - sync-submodules
  prepare-service:
    steps:
      - checkout-submodules
      - run: make source-key
      - run: dockerize -wait tcp://localhost:5432 -wait tcp://localhost:9009 -timeout 1m
      - restore_cache:
          name: restore go cache
          keys:
            - migrieren-go-cache-{{ checksum "go.sum" }}-{{ checksum "~/.go-version" }}
            - migrieren-go-cache-
      - restore_cache:
          name: restore ruby cache
          keys:
            - migrieren-ruby-cache-{{ checksum "test/Gemfile.lock" }}-{{ checksum "~/.ruby-version" }}
            - migrieren-ruby-cache-
      - run: make clean
      - run: make dep
      - restore_cache:
          name: restore go build cache
          keys:
            - migrieren-go-build-cache-{{ checksum "go.sum" }}-{{ checksum "~/.go-version" }}-{{ checksum ".source-key" }}
            - migrieren-go-build-cache-

executors:
  go-with-postgres-mimir:
    docker:
      - image: alexfalkowski/go:5.4
      - image: postgres:18-trixie
        environment:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
      - image: grafana/mimir:latest
        command: -server.http-listen-port=9009 -auth.multitenancy-enabled=false -ingester.ring.replication-factor=1
  release:
    docker:
      - image: alexfalkowski/release:8.36
  alpine:
    docker:
      - image: alpine:latest
  go:
    docker:
      - image: alexfalkowski/go:5.4

jobs:
  build-service:
    executor: go-with-postgres-mimir
    working_directory: ~/migrieren
    steps:
      - prepare-service
      - save_cache:
          name: save go cache
          key: migrieren-go-cache-{{ checksum "go.sum" }}-{{ checksum "~/.go-version" }}
          paths:
            - ~/go/pkg/mod
      - save_cache:
          name: save ruby cache
          key: migrieren-ruby-cache-{{ checksum "test/Gemfile.lock" }}-{{ checksum "~/.ruby-version" }}
          paths:
            - test/vendor
      - restore_cache:
          name: restore go lint cache
          keys:
            - migrieren-go-lint-cache-{{ checksum "go.sum" }}-{{ checksum "~/.go-lint-version" }}-{{ checksum ".source-key" }}
            - migrieren-go-lint-cache-
      - run: make clean
      - run: make lint
      - save_cache:
          name: save go lint cache
          key: migrieren-go-lint-cache-{{ checksum "go.sum" }}-{{ checksum "~/.go-lint-version" }}-{{ checksum ".source-key" }}
          paths:
            - ~/.cache/golangci-lint
      - run: make proto-breaking
      - run: make proto-stale
      - run: make sec
      - run: make build
      - run: make analyse
      - save_cache:
          name: save go build cache
          key: migrieren-go-build-cache-{{ checksum "go.sum" }}-{{ checksum "~/.go-version" }}-{{ checksum ".source-key" }}
          paths:
            - ~/.cache/go-build
    resource_class: arm.large
  features-http:
    executor: go-with-postgres-mimir
    working_directory: ~/migrieren
    steps:
      - prepare-service
      - run: make github-source
      - run: make features-http
      - store_test_results:
          path: test/reports
      - store_artifacts:
          path: test/reports
      - run: make coverage-workspace-stage partition=http
      - persist_to_workspace:
          root: /tmp/migrieren-reports
          paths:
            - http
    resource_class: arm.large
  features-grpc:
    executor: go-with-postgres-mimir
    working_directory: ~/migrieren
    steps:
      - prepare-service
      - run: make github-source
      - run: make features-grpc
      - store_test_results:
          path: test/reports
      - store_artifacts:
          path: test/reports
      - run: make coverage-workspace-stage partition=grpc
      - persist_to_workspace:
          root: /tmp/migrieren-reports
          paths:
            - grpc
    resource_class: arm.large
  benchmarks:
    executor: go-with-postgres-mimir
    working_directory: ~/migrieren
    steps:
      - prepare-service
      - run: make benchmarks
      - store_test_results:
          path: test/reports
      - store_artifacts:
          path: test/reports
      - run: make coverage-workspace-stage partition=benchmarks
      - persist_to_workspace:
          root: /tmp/migrieren-reports
          paths:
            - benchmarks
    resource_class: arm.large
  coverage:
    executor: go
    working_directory: ~/migrieren
    steps:
      - checkout-submodules
      - attach_workspace:
          at: /tmp/migrieren-reports
      - run: make coverage-workspace-restore
      - run: make coverage
      - store_test_results:
          path: test/reports
      - store_artifacts:
          path: test/reports
      - run: make codecov-upload
    resource_class: arm.large
  sync:
    executor: release
    working_directory: ~/migrieren
    steps:
      - checkout-submodules
      - run: make sync push
    resource_class: arm.large
  version:
    executor: release
    working_directory: ~/migrieren
    steps:
      - checkout-submodules
      - run: make source-key
      - restore_cache:
          name: restore go cache
          keys:
            - migrieren-go-cache-{{ checksum "go.sum" }}-{{ checksum "~/.go-version" }}
            - migrieren-go-cache-
      - restore_cache:
          name: restore go build cache
          keys:
            - migrieren-go-build-cache-{{ checksum "go.sum" }}-{{ checksum "~/.go-version" }}-{{ checksum ".source-key" }}
            - migrieren-go-build-cache-
      - run: version
      - persist_to_workspace:
          root: /tmp/workspace
          paths:
            - .
      - run: package
    resource_class: arm.large
  wait-all:
    executor: alpine
    resource_class: small
    steps:
      - run: echo "all applicable jobs finished"
  test-docker-amd64:
    executor: go
    working_directory: ~/migrieren
    steps:
      - checkout-submodules
      - setup_remote_docker:
          docker_layer_caching: true
      - run: make platform=amd64 test-docker
    resource_class: large
  test-docker-arm64:
    executor: go
    working_directory: ~/migrieren
    steps:
      - checkout-submodules
      - setup_remote_docker:
          docker_layer_caching: true
      - run: make platform=arm64 test-docker
    resource_class: arm.large
  release-docker-amd64:
    executor: go
    working_directory: ~/migrieren
    steps:
      - checkout-submodules
      - attach_workspace:
          at: /tmp/workspace
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: make login
          command: echo "$DOCKERHUB_PASS" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - run: make platform=amd64 release-docker
    resource_class: large
  release-docker-arm64:
    executor: go
    working_directory: ~/migrieren
    steps:
      - checkout-submodules
      - attach_workspace:
          at: /tmp/workspace
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: make login
          command: echo "$DOCKERHUB_PASS" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - run: make platform=arm64 release-docker
    resource_class: arm.large
  manifest-docker:
    executor: go
    working_directory: ~/migrieren
    steps:
      - checkout-submodules
      - attach_workspace:
          at: /tmp/workspace
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: make login
          command: echo "$DOCKERHUB_PASS" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - run: make manifest-docker
    resource_class: arm.large

workflows:
  migrieren:
    max_auto_reruns: 3
    jobs:
      - build-service
      - features-http:
          requires:
            - build-service
      - features-grpc:
          requires:
            - build-service
      - benchmarks:
          requires:
            - build-service
      - coverage:
          requires:
            - features-http
            - features-grpc
            - benchmarks
      - test-docker-amd64:
          filters:
            branches:
              ignore: master
      - test-docker-arm64:
          filters:
            branches:
              ignore: master
      - sync:
          requires:
            - coverage
            - test-docker-amd64
            - test-docker-arm64
          filters:
            branches:
              ignore: master
      - version:
          context: gh
          serial-group: << pipeline.project.slug >>/version
          requires:
            - coverage
          filters:
            branches:
              only: master
      - release-docker-amd64:
          context: docker
          requires:
            - version
          filters:
            branches:
              only: master
      - release-docker-arm64:
          context: docker
          requires:
            - version
          filters:
            branches:
              only: master
      - manifest-docker:
          context: docker
          serial-group: << pipeline.project.slug >>/manifest-docker
          requires:
            - release-docker-amd64
            - release-docker-arm64
          filters:
            branches:
              only: master
      - wait-all:
          requires:
            - coverage
            - sync
            - features-http
            - features-grpc
            - benchmarks
            - test-docker-amd64
            - test-docker-arm64
            - version
            - release-docker-amd64
            - release-docker-arm64
            - manifest-docker
